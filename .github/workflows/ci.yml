name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meetingconverter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            marks: not live and not windows_only
          - runner: windows-latest
            platform: windows
            marks: not live
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      S6_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      S6_PLATFORM: ${{ matrix.platform }}
      S6_MARKS: ${{ matrix.marks }}
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.S6_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Provision native audio probe on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version
      - name: Provision native audio probe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffprobe -version
      - name: Test shared coverage reference
        run: python -m unittest discover -s tools/anti_trick_gate_spec/tests
      - name: Inventory every admitted owner test
        run: >-
          python -m pytest -q -p tools.anti_trick_gate_spec.pytest_probe
          --s6-revision "$S6_REVISION" --s6-evidence s6-collected.json
          --collect-only -m "$S6_MARKS" tests/
      - name: Run the same complete owner suite
        run: >-
          python -m pytest -q -p tools.anti_trick_gate_spec.pytest_probe
          --s6-revision "$S6_REVISION" --s6-evidence s6-executed.json
          -m "$S6_MARKS" tests/
      - name: Verify executed coverage against the owner policy
        run: >-
          python -m tools.anti_trick_gate_spec coverage
          --policy tests/contract/test_policy.json --revision "$S6_REVISION"
          --platform "$S6_PLATFORM" s6-collected.json s6-executed.json
      - name: Publish actual node receipts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: meetingconverter-owner-${{ matrix.platform }}-${{ env.S6_REVISION }}
          path: s6-*.json
